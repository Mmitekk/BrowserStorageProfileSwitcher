name: Build & Release Extension

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Extension ZIP
        run: |
          zip -r BrowserStorageProfileSwitcher.zip \
            manifest.json \
            background.js \
            heal-data.js \
            popup.html \
            popup.css \
            popup.js \
            README.md \
            LICENSE \
            icons/

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: BrowserStorageProfileSwitcher.zip
          generate_release_notes: true
